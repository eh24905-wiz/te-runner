name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check wizlab/wizlab wizlab/test_wizlab.py reaper/reap_orphans.py reaper/test_reap_orphans.py test_entrypoint.py
      # Gate complexity so it can't regress; thresholds pass today (worst functions are C).
      - run: xenon --max-absolute D --max-average B wizlab/wizlab
      - run: radon cc wizlab/wizlab -s -a   # report in the log; xenon above is the gate
      - run: python wizlab/test_wizlab.py
      - run: python reaper/test_reap_orphans.py
      - run: python test_entrypoint.py
