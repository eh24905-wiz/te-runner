name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check wizlab/wizlab reaper/reap_orphans.py
      # Gate complexity so it can't regress; thresholds pass today (worst is cmd_role_inspect at D).
      - run: xenon --max-absolute D --max-average B wizlab/wizlab
      - run: radon cc wizlab/wizlab -s -a   # report in the log; xenon above is the gate
      - run: python wizlab/test_wizlab.py   # exit-code contract + IAM parsing + flag/dispatch invariants
